<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Nhận Mã Discord</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background-color: #1e293b; padding: 2.5rem; border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; max-width: 420px; width: 90%; border: 1px solid #334155; }
        h2 { color: #38bdf8; margin-bottom: 0.8rem; font-size: 1.5rem; }
        p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; margin-bottom: 1.2rem; }
        .code-box { background-color: #090d16; border: 2px dashed #38bdf8; border-radius: 0.5rem; padding: 1.2rem; margin: 1.5rem 0; font-family: monospace; font-size: 1.6rem; font-weight: bold; color: #4ade80; letter-spacing: 2px; user-select: all; cursor: pointer; }
        .command-highlight { color: #facc15; font-weight: bold; background-color: #334155; padding: 2px 6px; border-radius: 4px; }
        .timer { color: #f87171; font-size: 0.85rem; margin-top: 0.8rem; }
        .btn-redirect { display: inline-block; margin-top: 15px; color: #38bdf8; font-weight: bold; text-decoration: none; border: 1px solid #38bdf8; padding: 10px 20px; border-radius: 6px; transition: 0.2s; }
        .btn-redirect:hover { background-color: #38bdf8; color: #0f172a; }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <h2>🔑 MÃ BÍ MẬT HÔM NAY</h2>
    <p>Sao chép mã bên dưới, quay lại Discord và gõ lệnh:<br>
    <span class="command-highlight">/verify</span></p>

    <div class="code-box" id="secretCode">Đang tải mã...</div>

    <div class="timer" id="timer">Mã sẽ ẩn sau: 60s</div>
</div>

<script>
    const LINK_NHIEM_VU = "https://link4sub.com/PTTGetkmlw";
    const codeElement = document.getElementById('secretCode');
    const timerElement = document.getElementById('timer');
    const mainContainer = document.getElementById('mainContainer');

    async function fetchSecretCode() {
        const urlParams = new URLSearchParams(window.location.search);
        const accessKey = urlParams.get('access') || '';

        try {
            // Gọi đến API bảo mật trên Vercel
            const response = await fetch(`/api/get-code?access=${accessKey}`);
            const data = await response.json();

            if (response.ok) {
                codeElement.innerText = data.code;
                startTimer();
            } else {
                mainContainer.innerHTML = `
                    <h2 style="color: #f87171;">⚠️ TRUY CẬP BỊ CẤM!</h2>
                    <p style="color: #cbd5e1; margin-top: 10px;">${data.error || "Truy cập không hợp lệ."}</p>
                    <p style="color: #94a3b8; font-size: 0.85rem;">Vui lòng vượt qua trang nhiệm vụ để lấy mã.</p>
                    <a href="${LINK_NHIEM_VU}" class="btn-redirect">👉 Đến Trang Vượt Link</a>
                `;
            }
        } catch (error) {
            codeElement.innerText = "LỖI KẾT NỐI SERVER";
        }
    }

    function startTimer() {
        let timeLeft = 60;
        const countdown = setInterval(() => {
            timeLeft--;
            timerElement.innerText = `Mã sẽ ẩn sau: ${timeLeft}s`;
            if (timeLeft <= 0) {
                clearInterval(countdown);
                codeElement.innerText = "******";
                timerElement.innerText = "Mã đã hết hạn hiển thị! Vui lòng làm lại nhiệm vụ.";
            }
        }, 1000);
    }

    fetchSecretCode();
</script>

</body>
</html>
