<script>
    // BIN ID LẤY TỪ MÀN HÌNH BẠN CHỤP: 6a896df3f5f4af5e2934a611
    const JSONBIN_URL = "https://api.jsonbin.io/v3/b/6a896df3f5f4af5e2934a611/latest";
    
    // DÁN MASTER KEY LẤY Ở BƯỚC 1 VÀO ĐÂY
    const MASTER_KEY = "$2a$10$S20o9MoR16s9PNzFHydENuQ8N7PVdRcU1KOKSDB.6T2IxhYYRjAKO";

    function loadCode() {
        fetch(JSONBIN_URL, {
            method: "GET",
            headers: {
                "X-Master-Key": MASTER_KEY,
                "X-Bin-Meta": "false"
            }
        })
        .then(res => {
            if (!res.ok) throw new Error("Lỗi HTTP: " + res.status);
            return res.json();
        })
        .then(data => {
            if (data && data.code) {
                document.getElementById("codeDisplay").innerText = data.code;
                startTimer(60);
            } else {
                document.getElementById("codeDisplay").innerText = "LỖI ĐỊNH DẠNG";
            }
        })
        .catch(err => {
            console.error(err);
            document.getElementById("codeDisplay").innerText = "LỖI TẢI MÃ";
        });
    }

    function startTimer(seconds) {
        let timeLeft = seconds;
        const timerEl = document.getElementById("timerDisplay");
        const interval = setInterval(() => {
            timeLeft--;
            timerEl.innerText = `Mã sẽ ẩn sau: ${timeLeft}s`;
            if (timeLeft <= 0) {
                clearInterval(interval);
                document.getElementById("codeDisplay").innerText = "ĐÃ HẾT HẠN";
                timerEl.innerText = "Vui lòng vượt lại Link4Sub để lấy mã mới!";
            }
        }, 1000);
    }

    loadCode();
</script>
