<script>
    const JSONBIN_API_KEY = "$2a$10$S20o9MoR16s9PNzFHydENuQ8N7PVdRcU1KOKSDB.6T2IxhYYRjAKO";
    const JSONBIN_PASS_BIN_ID = "6a896df3f5f4af5e2934a611";
    const LINK_NHIEM_VU = "https://link4sub.com/Pnsnnzvl6O"; // Link rút gọn nhiệm vụ của bạn

    const codeElement = document.getElementById('secretCode');
    const timerElement = document.getElementById('timer');

    // 🛡️ CHỨC NĂNG CHỐNG TRUY CẬP TRỰC TIẾP (ANTI-DIRECT ACCESS)
    function checkValidAccess() {
        const referrer = document.referrer; // Lấy trang nguồn mà user click chuyển sang
        const urlParams = new URLSearchParams(window.location.search);
        const hasToken = urlParams.get('token'); // Hoặc token xác thực trên URL

        // Kiểm tra nếu người dùng gõ trực tiếp URL (không có Referrer từ trang rút gọn)
        if (!referrer || (!referrer.includes('link4sub.com') && !referrer.includes('link4sub'))) {
            // Trường hợp truy cập chui / dán trực tiếp link
            document.body.innerHTML = `
                <div style="color: #f87171; text-align: center; padding: 2rem; font-family: sans-serif;">
                    <h2>⚠️ TRUY CẬP BỊ CẤM!</h2>
                    <p style="margin-top: 10px; color: #cbd5e1;">Bạn không thể truy cập trực tiếp trang này để lấy mã.</p>
                    <p style="margin-top: 15px;">
                        <a href="${LINK_NHIEM_VU}" style="color: #38bdf8; font-weight: bold; text-decoration: none; border: 1px solid #38bdf8; padding: 8px 16px; border-radius: 5px;">
                            👉 Vượt Link Nhiệm Vụ Để Lấy Mã
                        </a>
                    </p>
                </div>
            `;
            return false;
        }
        return true;
    }

    // LẤY MÃ TỪ JSONBIN KHI TRUY CẬP HỢP LỆ
    async function fetchSecretCode() {
        // Nếu không hợp lệ thì dừng ngay, không gọi API lấy mã
        if (!checkValidAccess()) return;

        try {
            const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_PASS_BIN_ID}/latest`, {
                method: 'GET',
                headers: {
                    'X-Master-Key': JSONBIN_API_KEY,
                    'X-Bin-Meta': 'false'
                }
            });

            if (response.ok) {
                const data = await response.json();
                const code = data.code || "KHONG_CO_MA";
                codeElement.innerText = code;
                startTimer();
            } else {
                codeElement.innerText = "LỖI LẤY MÃ";
            }
        } catch (error) {
            codeElement.innerText = "LỖI KẾT NỐI";
        }
    }

    function startTimer() {
        let timeLeft = 60;
        const countdown = setInterval(() => {
            timeLeft--;
            timerElement.innerText = `Mã sẽ ẩn sau: ${timeLeft}s`;
            if (timeLeft <= 0) {
                clearInterval(countdown);
                codeElement.innerText = "******";
                timerElement.innerText = "Mã đã hết hạn hiển thị! Vui lòng làm lại nhiệm vụ.";
            }
        }, 1000);
    }

    fetchSecretCode();
</script>
